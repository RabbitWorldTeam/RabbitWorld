name: Build Rabbit World

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test pack assembly
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build client and server packs from the same Rabbit releases
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 scripts/build.py both
      - name: Publish both packs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          client=(dist/Rabbit-World-Client-*.zip)
          server=(dist/Rabbit-World-Server-*.zip)
          [[ ${#client[@]} == 1 && ${#server[@]} == 1 ]]
          gh release create "$RELEASE_TAG" "${client[0]}" "${server[0]}" \
            --verify-tag --generate-notes
